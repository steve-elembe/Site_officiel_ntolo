  <path d="M50 54 Q40 50 34 56 Q44 58 50 56" fill="#fef08a"/>
  <path d="M50 54 Q60 50 66 56 Q56 58 50 56" fill="#fef08a"/>
  <path d="M50 60 Q38 58 32 64 Q42 65 50 62" fill="#fef08a"/>
