  <path d="M50 14 C72 14 82 25 82 48 C82 70 50 84 50 84 C50 84 18 70 18 48 C18 25 28 14 50 14 Z" fill="none" stroke="#fef3c7" stroke-width="1.5" opacity="0.8"/>
